<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NSS KHMHSS Valakkulam – Not Me, But You</title>
    <meta name="description" content="The digital legacy of the NSS unit at KHMHSS Valakkulam — preserving service, leadership, camps, and memories since 1982. Not Me, But You." />
    <meta name="author" content="NSS Unit – KHMHSS Valakkulam" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#042413" />
    <link rel="icon" type="image/svg+xml" href="/nss-logo.svg" />
    <link rel="canonical" href="https://nss-rho-two.vercel.app/" />
    <meta property="og:title" content="NSS KHMHSS Valakkulam – Not Me, But You" />
    <meta property="og:description" content="A living canvas of service, leadership, and community. The spirit of volunteerism, preserved forever." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nss-rho-two.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NSS KHMHSS Valakkulam – Not Me, But You" />
    <meta name="twitter:description" content="A living canvas of service, leadership, and community." />

    <!-- Preconnect to Google Fonts origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Critical display fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet" />

    <!-- Preload critical LCP fallback image to resolve discovery delay -->
    <link rel="preload" as="image" href="/gate.webp" fetchpriority="high" />

    <!-- Inline splash styles — rendered before any JS loads -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body, #root {
        width: 100%;
        height: 100%;
      }

      #nss-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #042413;
        transition: opacity 0.5s ease;
      }

      #nss-splash.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      .splash-ring {
        position: relative;
        width: 96px;
        height: 96px;
        flex-shrink: 0;
      }

      .splash-ring-track {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid rgba(255,255,255,0.08);
      }

      .splash-ring-fill {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid transparent;
        border-top-color: #1b3a27;
        border-right-color: #a04021;
        animation: splash-spin 1.1s cubic-bezier(0.6,0.2,0.4,0.9) infinite;
      }

      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }

      .splash-logo {
        position: absolute;
        inset: 10px;
        border-radius: 50%;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .splash-logo svg {
        width: 52px;
        height: 52px;
      }

      .splash-text {
        text-align: center;
        animation: splash-fadein 0.9s 0.3s ease both;
      }

      @keyframes splash-fadein {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .splash-unit {
        font-family: 'DM Sans', sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.45);
        margin-bottom: 6px;
      }

      .splash-title {
        font-family: 'Libre Caslon Text', serif;
        font-size: 22px;
        font-weight: 700;
        color: #ffffff;
        line-height: 1.2;
        margin-bottom: 8px;
      }

      .splash-title span {
        color: #ff8762;
      }

      .splash-motto {
        font-family: 'DM Sans', sans-serif;
        font-size: 13px;
        font-weight: 500;
        color: rgba(255,255,255,0.55);
        font-style: italic;
      }

      .splash-motto-ml {
        font-family: 'DM Sans', sans-serif;
        font-size: 13px;
        color: rgba(255,255,255,0.40);
        margin-top: 4px;
        font-style: normal;
      }

      .splash-dots {
        display: flex;
        gap: 6px;
        animation: splash-fadein 0.9s 0.8s ease both;
      }

      .splash-dots span {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: rgba(255,255,255,0.3);
        animation: splash-pulse 1.2s ease infinite;
      }

      .splash-dots span:nth-child(2) { animation-delay: 0.2s; }
      .splash-dots span:nth-child(3) { animation-delay: 0.4s; }

      @keyframes splash-pulse {
        0%, 80%, 100% { transform: scale(0.7); opacity: 0.35; }
        40% { transform: scale(1); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <!-- Splash screen: visible instantly, removed by React after router resolves -->
    <div id="nss-splash" role="status" aria-label="Loading NSS KHMHSS Valakkulam…">
      <div class="splash-ring">
        <div class="splash-ring-track"></div>
        <div class="splash-ring-fill"></div>
        <div class="splash-logo">
          <img src="/nss-logo.svg" alt="NSS Logo" style="width: 100%; height: 100%; object-fit: contain;" />
        </div>
      </div>
      <div class="splash-text">
        <div class="splash-unit">NSS KHMHSS Valakkulam</div>
        <div class="splash-title">Not Me<span>,</span> But <span>You</span></div>
        <div class="splash-motto">A legacy of service and compassion</div>
        <div class="splash-motto-ml">സേവനത്തിന്റെയും കരുണയുടെയും പരമ്പര</div>
      </div>
      <div class="splash-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <!-- React root — THIS WAS MISSING! -->
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
